; ============================================================
;  Configuracao de backtest do MetaTrader 4 (linha de comando)
;  Edite os campos marcados com  <<< EDITAR  e salve.
;  Rodar com:  terminal.exe "C:\caminho\backtest.ini"
; ============================================================

[Tester]
TestExpert=Moving Average            ; <<< EDITAR: nome EXATO do EA (sem .ex4)
TestExpertParameters=ma.set          ; arquivo .set na pasta tester\ (ou apague esta linha p/ inputs padrao)
TestSymbol=EURUSD                    ; <<< EDITAR: nome EXATO do simbolo no seu broker
TestPeriod=H1                        ; M1 M5 M15 M30 H1 H4 D1 W1 MN
TestModel=0                          ; 0=Every tick  1=Control points  2=Open prices only
TestOptimization=false               ; true = varre parametros (otimizacao)
TestDateEnable=true                  ; usar intervalo de datas abaixo
TestFromDate=2023.01.01              ; <<< EDITAR: data inicial (AAAA.MM.DD)
TestToDate=2023.12.31                ; <<< EDITAR: data final  (AAAA.MM.DD)
TestReport=tester\rel_EURUSD_2023    ; relatorio .htm salvo na pasta do MT4
TestReplaceReport=true               ; sobrescreve se ja existir
TestShutdownTerminal=true            ; fecha o MT4 ao terminar (NAO mude: essencial p/ script)
TestVisualEnable=false               ; false = roda rapido (sem modo visual)

; --- Descomente e preencha SO se o EA/simbolo exigir conta logada ---
; [Common]
; Login=12345678
; Password=suaSenha
; Server=SeuBroker-Server
